<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>This preview has come down — Veracod</title>
<!-- 撤页后留下的占位页（他 2026-09-26 定：满 30 天自动撤）。⛔ 不许出现店名、照片、任何对方的东西 —— 撤就是撤干净。
     pool/takedown.mjs 会把这份原样写进每个被撤的 demo/<slug>/index.html。 -->
<style>
  :root { --bg: #f6f4ef; --ink: #1d1c1a; --soft: #6b6862; --line: #dcd8cf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --ink: #ecebe7; --soft: #9a978f; --line: #2d2c29; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink); font: 17px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 440px; }
  .mark { font: 600 13px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--soft); margin-bottom: 28px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 14px; font-weight: 600; }
  p { margin: 0 0 14px; color: var(--soft); }
  a { color: var(--ink); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 26px 0 18px; }
  small { color: var(--soft); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark">VERACOD</div>
  <h1>This preview has come down.</h1>
  <p>It was a concept page we built and offered for 30 days. The 30 days are up, so it's gone, as promised.</p>
  <p>Want to see it again? Reply to the email it came in, or write to <a href="mailto:hello@veracod.com">hello@veracod.com</a>. It goes back up the same day.</p>
  <hr>
  <small><a href="https://veracod.com/">veracod.com</a></small>
</main>
</body>
</html>
